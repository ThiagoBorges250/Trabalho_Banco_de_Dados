<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Média do Aluno</title>
</head>

<body>

<h1>Consultar Média</h1>

<form method="POST">

    {% csrf_token %}

    <label>Aluno:</label>

    <select name="id_aluno" required>

        <option value="">Selecione um aluno</option>

        {% for aluno in alunos %}

            <option value="{{ aluno.id_aluno }}"
                {% if aluno_selecionado == aluno.id_aluno|stringformat:"s" %}
                    selected
                {% endif %}
            >
                {{ aluno.nome }}
            </option>

        {% endfor %}

    </select>

    <button type="submit">
        Calcular Média
    </button>

</form>

{% if media is not None %}

    <h2>Média: {{ media }}</h2>

{% endif %}

</body>
</html>
